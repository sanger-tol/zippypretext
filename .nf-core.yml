lint:
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-zippypretext_logo_light.png
    - docs/images/nf-core-zippypretext_logo_light.png
    - docs/images/nf-core-zippypretext_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-zippypretext_logo_light.png
    - docs/images/nf-core-zippypretext_logo_light.png
    - docs/images/nf-core-zippypretext_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  multiqc_config:
    - report_comment
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
nf_core_version: 3.5.2
repository_type: pipeline
template:
  author: Yumisims
  description: A Nextflow pipeline that generates Hi-C maps in Pretext format while
    preserving previous alignment information.
  author: Yumisims
  version: 1.0.0dev
  force: true
  outdir: .
  is_nfcore: false
  skip_features:
    - igenomes
    - codespaces
    - fastqc
    - adaptivecard
    - seqera_platform
    - multiqc
    - rocrate
